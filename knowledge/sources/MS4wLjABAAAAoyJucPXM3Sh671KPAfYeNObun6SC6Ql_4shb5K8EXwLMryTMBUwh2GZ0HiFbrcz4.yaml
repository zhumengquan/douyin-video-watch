reliability: 0.65
why_this_reliability: 从 0.6 微调到 0.65。理由：面板数值本身的可信度较高（同一条视频里 官方大屏与 App 面板互相印证过），且本轮 10 条的面板数据内部一致 （逐次速度、ROM、损失百分比三者自洽，能互相验算）。
  但简介文案与画面出过错（见 bias），且样本选择性明显，故不到 0.7。
known_bias:
- 只发达标或接近达标的试举，失败镜头极少
- 设备是自家产品，展示方式带营销色彩
- 简介存在数字错误：7701898803649395816 简介写 188kg，画面大屏是 184kg
- 文案高度模板化：多条深蹲视频用几乎同一套词（「丝滑的轨迹」「流畅的髋膝联动」 「像欣赏一件艺术品」），这类形容词无法从画面验证，不构成信息
- 会把两组不同的举剪进同一条视频（7702871918802693218 前段 140kg×4、 后段仍是 140kg×4 的另一角度），简介只说一个数字，容易让人把两组混为一组
