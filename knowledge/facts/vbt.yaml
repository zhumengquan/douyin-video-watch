- id: vbt.squat_velocity_decay_235kg.v2
  claim: 高杠背蹲 235kg 连续 3 次的平均速度衰减约 34%（0.41 → 0.27），属明显疲劳信号
  value: 0.34
  unit: ratio
  topic: vbt
  sources:
  - aweme_id: '7702400712127814888'
    author: Arcus VBT
    t: 28.25
    kind: frame
    detail: 对比 1/3 的 0.41 与 3/3 的 0.27
  status: superseded
  supersedes: vbt.squat_velocity_decay_235kg
  note: 原 fact 只记了三个数值，没有给出"这意味着什么"。VBT 的用途恰恰是看衰减，故把结论补进来，旧条保留为原始观测。
  first_seen: '2026-11-10'
  last_seen: '2026-11-10'
  confidence: 0.5
  superseded_by: vbt.squat_velocity_decay_235kg.v3
  superseded_on: '2026-11-10'
  superseded_reason: 原 v2 的结论是「235kg 衰减 34%，属明显疲劳信号」，把单组数据说成了规律。 本轮又拿到 4 组不同重量次数的深蹲数据：衰减从 10%（140kg×4）到
    53%（150kg×2）， 差距 5 倍；其中 140kg×4 那一组第3次速度还回升了（0.40→0.47），并非单调下降。 所以「34% 是明显疲劳」这个判断缺乏参照系 —— 34% 落在这个区间中段，
    既不算特别高也不算低。结论应改为：衰减幅度跨组差异极大，且可非单调， 单看首末比值不足以判定疲劳，需要同一个人同一重量的纵向基线。
