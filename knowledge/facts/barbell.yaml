- id: barbell.velocity_by_lift_type
  claim: 深蹲类动作平均速度约 0.3-0.4 m/s，抓举峰值速度约 1.7 m/s，量级差约 4-5 倍
  value:
    squat_mean: 0.3-0.4
    snatch_peak: 1.7+
  unit: m/s
  topic: barbell
  sources:
  - aweme_id: '7702400712127814888'
    author: Arcus VBT
    t: 15.0
    kind: frame
    detail: 深蹲 235kg Mean V 0.41
  - aweme_id: '7701392102367223907'
    author: Arcus VBT
    t: 4.88
    kind: frame
    detail: 抓举 91kg Peak V 1.77
  status: superseded
  confidence: 0.7
  note: 平均速度与峰值速度不是同一指标，此处对比只为说明量级差异，不可直接用于评估训练水平
  first_seen: '2026-11-10'
  last_seen: '2026-11-10'
  superseded_by: barbell.velocity_by_lift_type.v2
  superseded_on: '2026-11-10'
  superseded_reason: 原结论说「深蹲 0.3-0.4、抓举 1.7，量级差 4-5 倍」，容易被读成 「深蹲比抓举慢 4-5 倍」。这是错的：4-5 倍主要是 Mean 与 Peak
    的口径差， 而不是动作本身的速度差。同一套面板对深蹲输出 Mean V、对举重输出 Peak V， 两个指标定义不同（一个是全程平均，一个是一瞬间的最大值）， 放在一起比大小没有意义。改为把「口径不同，不可比」作为结论本身。
